# Enable the Sofle OLED Display / Nice View (depending on screen type)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_POINTING=y

# Enable support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow / Backlight settings
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Increase Bluetooth transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Idle / Sleep timeouts
CONFIG_ZMK_IDLE_TIMEOUT=180000
CONFIG_ZMK_SLEEP=n

# Enable ZMK Studio Support for runtime remapping
CONFIG_ZMK_STUDIO=y
